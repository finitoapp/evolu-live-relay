name: Code Quality

on:
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml, so main is checked by the run that deploys it rather
  # than by a second one racing alongside.
  workflow_call:

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bun Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # check = biome check . && tsc -b && vitest run
      - name: Run quality checks
        run: bun run check

  worker-build:
    name: Worker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bundles src/worker.ts the way a deploy would, without touching
      # Cloudflare: no account or API token needed for --dry-run.
      - name: Build the Worker bundle
        run: bunx wrangler deploy --dry-run --outdir dist
