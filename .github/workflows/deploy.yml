name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys queue rather than cancel: a half-finished one is worse than a slow
# one, and Cloudflare applies the Durable Object migration as part of it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Check
    uses: ./.github/workflows/code-quality.yml

  deploy:
    name: Deploy the Worker
    needs: check
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bunx, not the wrangler-action, so the version deployed with is the one
      # pinned in package.json and used by `bun run dev:worker` locally.
      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
